# Shared analysis options for the whole citrinium pub workspace (root app
# and every package/ member). Package-level analysis_options.yaml files
# should `include` this file (with a relative path) rather than duplicate it.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors) and via `flutter analyze` /
# `dart analyze` on the command line.
#
# NOTE: `custom_lint` (for `riverpod_lint`) is intentionally not wired in here
# yet -- it depends on `flutter_riverpod`, which lands with the app shell
# (M0/W4), not the toolchain/vault-I/O work done so far.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # freezed-generated unions need this on the sealed factory constructors.
    invalid_annotation_target: ignore

linter:
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
