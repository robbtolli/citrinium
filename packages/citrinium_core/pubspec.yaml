name: citrinium_core
description: >
  Pure-Dart vault I/O, Markdown parser/serializer, and index layer for
  Citrinium. No Flutter import is possible from this package.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  meta: ^1.16.0
  path: ^1.9.1
  unorm_dart: ^0.3.2
  watcher: ^1.2.1

dev_dependencies:
  build_runner: ^2.15.1
  test: ^1.25.15
