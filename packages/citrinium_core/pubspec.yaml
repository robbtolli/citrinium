name: citrinium_core
description: >
  Pure-Dart vault I/O, Markdown parser/serializer, and index layer for
  Citrinium. No Flutter import is possible from this package.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  drift: ^2.34.3
  meta: ^1.16.0
  path: ^1.9.1
  sqlite3: ^3.5.0
  unorm_dart: ^0.3.2
  watcher: ^1.2.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.15.1
  # Pinned below the ^2.34.1 boundary where drift_dev started requiring
  # `analyzer ^13.0.0`: the Flutter SDK bundled here hard-pins
  # `flutter_test`'s `test_api` to 0.7.11, which only resolves against
  # `package:test` 1.31.0, which itself caps `analyzer <13.0.0`. Revisit
  # once the SDK's flutter_test pin moves.
  drift_dev: ">=2.34.0 <2.34.1"
  test: ^1.25.15
