name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # `sqlite3`/`drift` (added in a later milestone) fetch prebuilt SQLite
      # binaries via a Dart build hook on first use per platform; caching the
      # pub-cache hosted directory means later CI runs skip that download.
      - name: Cache pub & native-asset build-hook downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies (workspace)
        run: flutter pub get

      # `build_runner` only needs to run for `citrinium_core` (the only
      # workspace member with generated code -- drift's schema.drift ->
      # index_database.g.dart, per W3). Pub workspaces share one lockfile,
      # but `build_runner` itself still only sees the package it's invoked
      # from, so this must run with that package as the working directory,
      # not the workspace root.
      - name: build_runner (generated code)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/citrinium_core

      - name: Analyze
        run: flutter analyze

      - name: Test citrinium_core (pure Dart)
        run: dart test
        working-directory: packages/citrinium_core

      - name: Test app
        run: flutter test
